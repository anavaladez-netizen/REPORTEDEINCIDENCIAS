<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reporte de Incidencias - Tally Form</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel Standalone -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Fuentes e Íconos -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in { animation: fadeIn 0.25s ease-out forwards; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // CREDENCIALES DE SUPABASE
    const SUPABASE_URL = "https://waueklmhwysbeqmbbmve.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndhdWVrbG1od3lzYmVxbWJibXZlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE5MTY0MzYsImV4cCI6MjEwNzQ5MjQzNn0.tRM1m_2Atx8bujtk7udNTF8oE6nbnXSHFtQJXmaqV3E";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // ÍCONOS
    const IconWrapper = ({ children, className = "w-4 h-4" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        {children}
      </svg>
    );

    const IconPlusCircle = (p) => <IconWrapper {...p}><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></IconWrapper>;
    const IconClipboardList = (p) => <IconWrapper {...p}><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4"/><path d="M12 16h4"/><path d="M8 11h.01"/><path d="M8 16h.01"/></IconWrapper>;
    const IconSettings = (p) => <IconWrapper {...p}><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></IconWrapper>;
    const IconLock = (p) => <IconWrapper {...p}><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></IconWrapper>;
    const IconLogIn = (p) => <IconWrapper {...p}><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></IconWrapper>;
    const IconArrowRight = (p) => <IconWrapper {...p}><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></IconWrapper>;
    const IconArrowLeft = (p) => <IconWrapper {...p}><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></IconWrapper>;
    const IconCheckCircle = (p) => <IconWrapper {...p}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></IconWrapper>;
    const IconAlertTriangle = (p) => <IconWrapper {...p}><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></IconWrapper>;
    const IconUploadCloud = (p) => <IconWrapper {...p}><polyline points="16 16 12 12 8 16"/><line x1="12" y1="12" x2="12" y2="21"/><path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"/><polyline points="16 16 12 12 8 16"/></IconWrapper>;
    const IconX = (p) => <IconWrapper {...p}><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></IconWrapper>;
    const IconSearch = (p) => <IconWrapper {...p}><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></IconWrapper>;
    const IconFileSpreadsheet = (p) => <IconWrapper {...p}><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><path d="M8 13h8"/><path d="M8 17h8"/><path d="M12 13v8"/></IconWrapper>;
    const IconEye = (p) => <IconWrapper {...p}><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></IconWrapper>;
    const IconEdit = (p) => <IconWrapper {...p}><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></IconWrapper>;
    const IconTrash2 = (p) => <IconWrapper {...p}><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></IconWrapper>;
    const IconMapPin = (p) => <IconWrapper {...p}><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></IconWrapper>;
    const IconUser = (p) => <IconWrapper {...p}><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></IconWrapper>;
    const IconPlus = (p) => <IconWrapper {...p}><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></IconWrapper>;
    const IconRefreshCw = (p) => <IconWrapper {...p}><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></IconWrapper>;

    const DEFAULT_CATALOGS = {
      sucursales: ['JESUS MARIA', 'CENTRO HISTORICO', 'NORTE - PLAZA', 'SUR - INDUSTRIAL', 'ORIENTE - GARZA', 'PONIENTE - CERRO'],
      reportoList: ['Gladys Alejandra Cuellar Gamez', 'Carlos Alberto Mendoza Cruz', 'María Elena Torres Delgado', 'José Luis Hernández Reyes', 'Ana Sofia Ramos Ramírez'],
      eventosList: ['SUSTRACCIÓN DE MERCANCÍA', 'HECHO DE TRÁNSITO TERRESTRE', 'DAÑO A INSTALACIONES', 'EXTORSION O FRAUDE', 'ACCIDENTE LABORAL', 'OTRO / INCIDENCIA GENERAL']
    };

    function App() {
      const [isAdminLoggedIn, setIsAdminLoggedIn] = useState(false);
      const [adminUsername, setAdminUsername] = useState('');
      const [adminPassword, setAdminPassword] = useState('');
      const [loginError, setLoginError] = useState('');

      const [toast, setToast] = useState(null);
      const [confirmModal, setConfirmModal] = useState(null);

      const [activeTab, setActiveTab] = useState('formulario');
      const [currentStep, setCurrentStep] = useState(1);

      const [catalogs, setCatalogs] = useState(DEFAULT_CATALOGS);
      const [incidents, setIncidents] = useState([]);
      const [loadingData, setLoadingData] = useState(false);
      const [submitting, setSubmitting] = useState(false);
      const [savingEdit, setSavingEdit] = useState(false);
      const [successMsg, setSuccessMsg] = useState('');

      const [selectedIncidentModal, setSelectedIncidentModal] = useState(null);
      const [editingIncident, setEditingIncident] = useState(null);

      const [newSucursal, setNewSucursal] = useState('');
      const [newReporto, setNewReporto] = useState('');
      const [newEvent, setNewEvent] = useState('');

      const [formData, setFormData] = useState({
        fecha: new Date().toISOString().split('T')[0],
        horaForm: new Date().toTimeString().slice(0, 5),
        sucursal: DEFAULT_CATALOGS.sucursales[0],
        horaEvento: new Date().toTimeString().slice(0, 5),
        reporto: DEFAULT_CATALOGS.reportoList[0],
        evento: DEFAULT_CATALOGS.eventosList[0],
        quienReportaText: '',
        montoTotal: '',
        fotoInventario: null,
        fotoSospechoso: null,
        evidenciaHechos: null,
        fotosVehiculo: null
      });

      const [searchTerm, setSearchTerm] = useState('');
      const [filterSucursal, setFilterSucursal] = useState('ALL');
      const [filterEvento, setFilterEvento] = useState('ALL');

      const fetchIncidentsFromSupabase = async () => {
        setLoadingData(true);
        try {
          const { data, error } = await supabase
            .from('incidencias')
            .select('*')
            .order('created_at', { ascending: false });

          if (error) {
            showToast("Error al cargar datos: " + error.message, "error");
          } else if (data) {
            const mapped = data.map((i) => ({
              id: i.id,
              fecha: i.fecha,
              horaForm: i.hora_form,
              sucursal: i.sucursal,
              horaEvento: i.hora_evento,
              reporto: i.reporto,
              evento: i.evento,
              quienReportaText: i.quien_reporta_text,
              montoTotal: i.monto_total,
              fotoInventario: i.foto_inventario,
              fotoSospechoso: i.foto_sospechoso,
              evidenciaHechos: i.evidencia_hechos,
              fotosVehiculo: i.fotos_vehiculo,
              status: i.status
            }));
            setIncidents(mapped);
          }
        } catch (e) {
          console.error(e);
        } finally {
          setLoadingData(false);
        }
      };

      useEffect(() => {
        fetchIncidentsFromSupabase();
      }, []);

      const showToast = (message, type = 'info') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 4000);
      };

      const handleFileUpload = (e, fieldKey, isEditing = false) => {
        const file = e.target.files[0];
        if (!file) return;

        if (file.size > 8 * 1024 * 1024) {
          showToast("El archivo excede el límite de 8MB.", "error");
          return;
        }

        const reader = new FileReader();
        reader.onloadend = () => {
          const fileObj = { name: file.name, type: file.type, data: reader.result };
          if (isEditing) {
            setEditingIncident((prev) => ({ ...prev, [fieldKey]: fileObj }));
          } else {
            setFormData((prev) => ({ ...prev, [fieldKey]: fileObj }));
          }
        };
        reader.readAsDataURL(file);
      };

      const handleAddCatalogItem = (category, value, resetSetter) => {
        if (!value || !value.trim()) return;
        const trimmedVal = value.trim();
        const currentList = catalogs[category] || [];
        
        if (currentList.some((item) => item.toLowerCase() === trimmedVal.toLowerCase())) {
          showToast(`La opción "${trimmedVal}" ya existe.`, 'warning');
          return;
        }

        const updated = { ...catalogs, [category]: [...currentList, trimmedVal] };
        setCatalogs(updated);
        resetSetter('');
        showToast(`"${trimmedVal}" agregada.`, 'success');
      };

      const handleDeleteCatalogItem = (category, itemToDelete) => {
        if (!isAdminLoggedIn) return;
        const currentList = catalogs[category] || [];
        const updated = { ...catalogs, [category]: currentList.filter((item) => item !== itemToDelete) };
        setCatalogs(updated);
        showToast(`Opción eliminada.`, 'info');
      };

      const handleAdminLogin = (e) => {
        e.preventDefault();
        if (adminUsername.toLowerCase() === 'admin' && adminPassword === 'admin123') {
          setIsAdminLoggedIn(true);
          setLoginError('');
          setAdminPassword('');
          showToast("Sesión iniciada como Admin", "success");
          setActiveTab('formulario');
        } else {
          setLoginError('Usuario o contraseña incorrectos.');
        }
      };

      const handleAdminLogout = () => {
        setIsAdminLoggedIn(false);
        showToast("Sesión de administrador cerrada", "info");
      };

      const handleSubmitForm = async (e) => {
        e.preventDefault();
        setSubmitting(true);
        setSuccessMsg('');

        const newId = 'INC-' + Math.floor(100000 + Math.random() * 900000);

        const newRecordSupabase = {
          id: newId,
          fecha: formData.fecha,
          hora_form: formData.horaForm,
          sucursal: formData.sucursal,
          hora_evento: formData.horaEvento,
          reporto: formData.reporto,
          evento: formData.evento,
          quien_reporta_text: formData.quienReportaText,
          monto_total: parseFloat(formData.montoTotal) || 0,
          foto_inventario: formData.fotoInventario,
          foto_sospechoso: formData.fotoSospechoso,
          evidencia_hechos: formData.evidenciaHechos,
          fotos_vehiculo: formData.fotosVehiculo,
          status: 'REGISTRADO'
        };

        const { error } = await supabase.from('incidencias').insert([newRecordSupabase]);

        if (error) {
          showToast("❌ Error al guardar en la nube: " + error.message, "error");
          setSubmitting(false);
          return;
        }

        setSuccessMsg('¡El reporte se ha guardado exitosamente en la nube!');
        setSubmitting(false);
        setCurrentStep(1);

        setFormData({
          fecha: new Date().toISOString().split('T')[0],
          horaForm: new Date().toTimeString().slice(0, 5),
          sucursal: catalogs.sucursales[0] || '',
          horaEvento: new Date().toTimeString().slice(0, 5),
          reporto: catalogs.reportoList[0] || '',
          evento: catalogs.eventosList[0] || '',
          quienReportaText: '',
          montoTotal: '',
          fotoInventario: null,
          fotoSospechoso: null,
          evidenciaHechos: null,
          fotosVehiculo: null
        });

        await fetchIncidentsFromSupabase();

        setTimeout(() => {
          setSuccessMsg('');
          setActiveTab('listado');
        }, 1800);
      };

      const handleSaveEdit = async (e) => {
        e.preventDefault();
        if (!editingIncident) return;
        setSavingEdit(true);

        const updatedDataSupabase = {
          fecha: editingIncident.fecha,
          hora_form: editingIncident.horaForm,
          sucursal: editingIncident.sucursal,
          hora_evento: editingIncident.horaEvento,
          reporto: editingIncident.reporto,
          evento: editingIncident.evento,
          quien_reporta_text: editingIncident.quienReportaText,
          monto_total: parseFloat(editingIncident.montoTotal) || 0,
          foto_inventario: editingIncident.fotoInventario,
          foto_sospechoso: editingIncident.fotoSospechoso,
          evidencia_hechos: editingIncident.evidenciaHechos,
          fotos_vehiculo: editingIncident.fotosVehiculo,
          status: editingIncident.status || 'REGISTRADO'
        };

        const { error } = await supabase.from('incidencias').update(updatedDataSupabase).eq('id', editingIncident.id);

        if (error) {
          showToast("Error al actualizar: " + error.message, "error");
        } else {
          showToast("Reporte actualizado.", "success");
          await fetchIncidentsFromSupabase();
          setEditingIncident(null);
          setSelectedIncidentModal(null);
        }
        setSavingEdit(false);
      };

      const handleDeleteIncident = (id) => {
        if (!isAdminLoggedIn) return;
        setConfirmModal({
          title: "Eliminar Registro",
          message: "¿Está seguro de eliminar esta incidencia permanentemente?",
          onConfirm: async () => {
            const { error } = await supabase.from('incidencias').delete().eq('id', id);
            if (error) {
              showToast("Error al eliminar: " + error.message, "error");
            } else {
              setIncidents((prev) => prev.filter((i) => i.id !== id));
              if (selectedIncidentModal?.id === id) setSelectedIncidentModal(null);
              showToast("Incidencia eliminada.", "info");
            }
            setConfirmModal(null);
          }
        });
      };

      const handleUpdateStatus = async (id, newStatus) => {
        if (!isAdminLoggedIn) return;
        const { error } = await supabase.from('incidencias').update({ status: newStatus }).eq('id', id);
        if (error) {
          showToast("Error al actualizar estado", "error");
        } else {
          setIncidents((prev) => prev.map((inc) => inc.id === id ? { ...inc, status: newStatus } : inc));
          showToast(`Estado actualizado`, "success");
        }
      };

      const filteredIncidents = incidents.filter((inc) => {
        const matchesSearch =
          (inc.sucursal || '').toLowerCase().includes(searchTerm.toLowerCase()) ||
          (inc.evento || '').toLowerCase().includes(searchTerm.toLowerCase()) ||
          (inc.reporto || '').toLowerCase().includes(searchTerm.toLowerCase()) ||
          (inc.quienReportaText || '').toLowerCase().includes(searchTerm.toLowerCase());

        const matchesSucursal = filterSucursal === 'ALL' || inc.sucursal === filterSucursal;
        const matchesEvento = filterEvento === 'ALL' || inc.evento === filterEvento;

        return matchesSearch && matchesSucursal && matchesEvento;
      });

      return (
        <div className="min-h-screen bg-slate-50 text-slate-800 flex flex-col">
          {/* HEADER PRINCIPAL */}
          <header className="bg-[#023047] text-white shadow-md sticky top-0 z-30">
            <div className="max-w-6xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-3">
              <div className="flex items-center space-x-3">
                <div className="w-10 h-10 rounded-xl bg-[#FFB701] flex items-center justify-center text-[#023047] font-extrabold text-xl shadow">
                  R
                </div>
                <div>
                  <div className="flex items-center space-x-2">
                    <h1 className="font-bold text-lg leading-tight tracking-wide">REPORTE DE INCIDENCIAS</h1>
                    <span className="flex items-center text-[10px] bg-emerald-500/20 text-emerald-300 font-semibold px-2 py-0.5 rounded-full border border-emerald-400/30">
                      <span className="w-1.5 h-1.5 bg-emerald-400 rounded-full mr-1 animate-pulse"></span>
                      100% Supabase
                    </span>
                  </div>
                  <p className="text-xs text-[#8ECAE6]">Base de datos compartida</p>
                </div>
              </div>

              <nav className="flex items-center space-x-1 sm:space-x-2 bg-[#011e2d] p-1.5 rounded-xl text-sm font-medium">
                <button
                  onClick={() => setActiveTab('formulario')}
                  className={`flex items-center px-3 py-1.5 rounded-lg transition ${
                    activeTab === 'formulario' ? 'bg-[#209EBB] text-white font-semibold shadow' : 'text-slate-300 hover:text-white hover:bg-white/10'
                  }`}
                >
                  <IconPlusCircle className="w-4 h-4 mr-1.5" /> Nuevo Reporte
                </button>

                <button
                  onClick={() => setActiveTab('listado')}
                  className={`flex items-center px-3 py-1.5 rounded-lg transition ${
                    activeTab === 'listado' ? 'bg-[#209EBB] text-white font-semibold shadow' : 'text-slate-300 hover:text-white hover:bg-white/10'
                  }`}
                >
                  <IconClipboardList className="w-4 h-4 mr-1.5" /> Historial ({incidents.length})
                </button>

                {isAdminLoggedIn && (
                  <button
                    onClick={() => setActiveTab('configuracion')}
                    className={`flex items-center px-3 py-1.5 rounded-lg transition ${
                      activeTab === 'configuracion' ? 'bg-[#FFB701] text-[#023047] font-bold shadow' : 'text-amber-300 hover:text-amber-100 hover:bg-white/10'
                    }`}
                  >
                    <IconSettings className="w-4 h-4 mr-1.5" /> Catálogos
                  </button>
                )}
              </nav>

              <div className="flex items-center space-x-2">
                {isAdminLoggedIn ? (
                  <div className="flex items-center bg-[#FFB701]/20 border border-[#FFB701]/40 rounded-lg px-2.5 py-1 text-xs text-[#FFB701]">
                    <IconLock className="w-3.5 h-3.5 mr-1" />
                    <span className="font-semibold mr-2">Admin</span>
                    <button onClick={handleAdminLogout} className="hover:text-red-300 underline ml-1">Salir</button>
                  </div>
                ) : (
                  <button
                    onClick={() => setActiveTab('login')}
                    className="flex items-center text-xs bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 px-2.5 py-1.5 rounded-lg transition"
                  >
                    <IconLogIn className="w-3.5 h-3.5 mr-1 text-[#8ECAE6]" /> Acceso Admin
                  </button>
                )}
              </div>
            </div>
          </header>

          <main className="flex-1 max-w-4xl w-full mx-auto p-4 sm:p-6">
            {successMsg && (
              <div className="mb-6 p-4 bg-emerald-50 border border-emerald-300 text-emerald-800 rounded-xl flex items-center shadow-sm animate-fade-in">
                <IconCheckCircle className="w-6 h-6 mr-3 text-emerald-600 flex-shrink-0" />
                <p className="font-semibold text-sm">{successMsg}</p>
              </div>
            )}

            {/* TAB 1: FORMULARIO */}
            {activeTab === 'formulario' && (
              <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                <div className="p-6 sm:p-10 max-w-2xl mx-auto">
                  <h2 className="text-2xl sm:text-3xl font-black text-[#023047] tracking-tight uppercase mb-8">
                    REPORTE DE INCIDENCIAS
                  </h2>

                  <div className="flex items-center justify-between mb-8 pb-4 border-b border-slate-100 text-xs font-semibold text-slate-400">
                    <span className={currentStep === 1 ? "text-[#209EBB] font-bold" : ""}>PASO 1 DE 2: INFORMACIÓN GENERAL</span>
                    <span className={currentStep === 2 ? "text-[#209EBB] font-bold" : ""}>PASO 2 DE 2: DETALLES Y EVIDENCIAS</span>
                  </div>

                  <form onSubmit={handleSubmitForm}>
                    {currentStep === 1 && (
                      <div className="space-y-6 animate-fade-in">
                        <div>
                          <label className="block text-sm font-semibold text-slate-800 mb-2">
                            Fecha y hora: <span className="text-red-500">*</span>
                          </label>
                          <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                            <input
                              type="date"
                              required
                              value={formData.fecha}
                              onChange={(e) => setFormData({ ...formData, fecha: e.target.value })}
                              className="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-[#209EBB] text-sm bg-slate-50/50"
                            />
                            <input
                              type="time"
                              required
                              value={formData.horaForm}
                              onChange={(e) => setFormData({ ...formData, horaForm: e.target.value })}
                              className="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-[#209EBB] text-sm bg-slate-50/50"
                            />
                          </div>
                        </div>

                        <div>
                          <label className="block text-sm font-semibold text-slate-800 mb-2">
                            Sucursal <span className="text-red-500">*</span>
                          </label>
                          <select
                            required
                            value={formData.sucursal}
                            onChange={(e) => setFormData({ ...formData, sucursal: e.target.value })}
                            className="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-[#209EBB] text-sm bg-slate-50/50"
                          >
                            {catalogs.sucursales.map((suc, idx) => (
                              <option key={idx} value={suc}>{suc}</option>
                            ))}
                          </select>
                        </div>

                        <div>
                          <label className="block text-sm font-semibold text-slate-800 mb-2">
                            Hora del evento: <span className="text-red-500">*</span>
                          </label>
                          <input
                            type="time"
                            required
                            value={formData.horaEvento}
                            onChange={(e) => setFormData({ ...formData, horaEvento: e.target.value })}
                            className="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-[#209EBB] text-sm bg-slate-50/50"
                          />
                        </div>

                        <div>
                          <label className="block text-sm font-semibold text-slate-800 mb-2">
                            Reportó: <span className="text-red-500">*</span>
                          </label>
                          <select
                            required
                            value={formData.reporto}
                            onChange={(e) => setFormData({ ...formData, reporto: e.target.value })}
                            className="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-[#209EBB] text-sm bg-slate-50/50"
                          >
                            {catalogs.reportoList.map((rep, idx) => (
                              <option key={idx} value={rep}>{rep}</option>
                            ))}
                          </select>
                        </div>

                        <div className="pt-4">
                          <button
                            type="button"
                            onClick={() => setCurrentStep(2)}
                            className="inline-flex items-center px-6 py-2.5 bg-black hover:bg-slate-800 text-white font-medium text-sm rounded-lg transition shadow-sm"
                          >
                            Continuar <IconArrowRight className="w-4 h-4 ml-2" />
                          </button>
                        </div>
                      </div>
                    )}

                    {currentStep === 2 && (
                      <div className="space-y-6 animate-fade-in">
                        <div>
                          <label className="block text-sm font-semibold text-slate-800 mb-2">
                            Evento: <span className="text-red-500">*</span>
                          </label>
                          <select
                            required
                            value={formData.evento}
                            onChange={(e) => setFormData({ ...formData, evento: e.target.value })}
                            className="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-[#209EBB] text-sm bg-slate-50/50"
                          >
                            {catalogs.eventosList.map((ev, idx) => (
                              <option key={idx} value={ev}>{ev}</option>
                            ))}
                          </select>
                        </div>

                        <div>
                          <label className="block text-sm font-semibold text-slate-800 mb-2">
                            Quien reporta: <span className="text-red-500">*</span>
                          </label>
                          <input
                            type="text"
                            required
                            placeholder="Nombre completo o cargo de quien reporta"
                            value={formData.quienReportaText}
                            onChange={(e) => setFormData({ ...formData, quienReportaText: e.target.value })}
                            className="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-[#209EBB] text-sm bg-slate-50/50"
                          />
                        </div>

                        <div>
                          <label className="block text-sm font-semibold text-slate-800 mb-1">
                            Foto del inventario en caso de sustracción de mercancía:
                          </label>
                          <UploadBox
                            id="fotoInventario"
                            fileData={formData.fotoInventario}
                            onChange={(e) => handleFileUpload(e, 'fotoInventario')}
                            onRemove={() => setFormData({ ...formData, fotoInventario: null })}
                          />
                        </div>

                        <div>
                          <label className="block text-sm font-semibold text-slate-800 mb-1">Foto del sospechoso:</label>
                          <UploadBox
                            id="fotoSospechoso"
                            fileData={formData.fotoSospechoso}
                            onChange={(e) => handleFileUpload(e, 'fotoSospechoso')}
                            onRemove={() => setFormData({ ...formData, fotoSospechoso: null })}
                          />
                        </div>

                        <div>
                          <label className="block text-sm font-semibold text-slate-800 mb-2">
                            Monto Total <span className="text-red-500">*</span>
                          </label>
                          <div className="relative">
                            <span className="absolute left-3.5 top-2.5 text-slate-400 font-medium text-sm">$</span>
                            <input
                              type="number"
                              step="0.01"
                              required
                              placeholder="0.00"
                              value={formData.montoTotal}
                              onChange={(e) => setFormData({ ...formData, montoTotal: e.target.value })}
                              className="w-full pl-8 pr-3.5 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-[#209EBB] text-sm bg-slate-50/50"
                            />
                          </div>
                        </div>

                        <div>
                          <label className="block text-sm font-semibold text-slate-800 mb-1">Evidencia de los hechos:</label>
                          <UploadBox
                            id="evidenciaHechos"
                            fileData={formData.evidenciaHechos}
                            onChange={(e) => handleFileUpload(e, 'evidenciaHechos')}
                            onRemove={() => setFormData({ ...formData, evidenciaHechos: null })}
                          />
                        </div>

                        <div>
                          <label className="block text-sm font-semibold text-slate-800 mb-1 leading-snug">
                            En caso de que la incidencia sea "HECHO DE TRANSITO TERRESTRE" favor de subir las fotos del vehículo:
                          </label>
                          <UploadBox
                            id="fotosVehiculo"
                            fileData={formData.fotosVehiculo}
                            onChange={(e) => handleFileUpload(e, 'fotosVehiculo')}
                            onRemove={() => setFormData({ ...formData, fotosVehiculo: null })}
                          />
                        </div>

                        <div className="pt-6 flex items-center justify-between border-t border-slate-100">
                          <button
                            type="button"
                            onClick={() => setCurrentStep(1)}
                            className="inline-flex items-center px-4 py-2 border border-slate-300 text-slate-700 hover:bg-slate-100 font-medium text-sm rounded-lg transition"
                          >
                            <IconArrowLeft className="w-4 h-4 mr-1.5" /> Volver al Paso 1
                          </button>

                          <button
                            type="submit"
                            disabled={submitting}
                            className="inline-flex items-center px-8 py-2.5 bg-black hover:bg-slate-800 text-white font-semibold text-sm rounded-lg transition shadow hover:shadow-md disabled:opacity-50"
                          >
                            {submitting ? (
                              <><IconRefreshCw className="w-4 h-4 mr-2 animate-spin" /> Guardando en Nube...</>
                            ) : (
                              <><IconArrowRight className="w-4 h-4 ml-2" /> Enviar Reporte</>
                            )}
                          </button>
                        </div>
                      </div>
                    )}
                  </form>
                </div>
              </div>
            )}

            {/* TAB 2: HISTORIAL */}
            {activeTab === 'listado' && (
              <div className="space-y-4 animate-fade-in">
                <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-col md:flex-row gap-3 items-center justify-between">
                  <div className="flex-1 w-full md:w-auto relative">
                    <IconSearch className="w-4 h-4 text-slate-400 absolute left-3 top-3" />
                    <input
                      type="text"
                      placeholder="Buscar por sucursal, evento, reportó..."
                      value={searchTerm}
                      onChange={(e) => setSearchTerm(e.target.value)}
                      className="w-full pl-9 pr-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-[#209EBB]"
                    />
                  </div>

                  <div className="flex flex-wrap items-center gap-2 w-full md:w-auto">
                    <button
                      onClick={fetchIncidentsFromSupabase}
                      className="flex items-center px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-lg transition"
                    >
                      <IconRefreshCw className={`w-3.5 h-3.5 mr-1 ${loadingData ? 'animate-spin' : ''}`} /> Actualizar
                    </button>
                  </div>
                </div>

                {loadingData ? (
                  <div className="bg-white p-12 rounded-2xl text-center border border-slate-200">
                    <IconRefreshCw className="w-8 h-8 mx-auto text-[#209EBB] animate-spin mb-3" />
                    <p className="text-sm font-semibold text-slate-600">Cargando reportes desde la nube...</p>
                  </div>
                ) : filteredIncidents.length === 0 ? (
                  <div className="bg-white p-12 rounded-2xl text-center border border-slate-200">
                    <IconAlertTriangle className="w-10 h-10 mx-auto text-amber-400 mb-2" />
                    <h3 className="font-bold text-slate-700 text-lg">No hay incidencias registradas aún</h3>
                  </div>
                ) : (
                  <div className="bg-white rounded-xl border border-slate-200 overflow-hidden shadow-sm">
                    <div className="overflow-x-auto">
                      <table className="w-full text-left text-xs text-slate-600">
                        <thead className="bg-[#023047] text-[#8ECAE6] uppercase font-bold text-[11px] tracking-wider">
                          <tr>
                            <th className="p-3">Fecha / Hora</th>
                            <th className="p-3">Sucursal</th>
                            <th className="p-3">Evento</th>
                            <th className="p-3">Reportó</th>
                            <th className="p-3">Monto</th>
                            <th className="p-3">Estado</th>
                            <th className="p-3 text-right">Acciones</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-100">
                          {filteredIncidents.map((inc) => (
                            <tr key={inc.id} className="hover:bg-slate-50 transition">
                              <td className="p-3 whitespace-nowrap">
                                <div className="font-medium text-slate-800">{inc.fecha}</div>
                                <div className="text-[11px] text-slate-400">{inc.horaEvento || inc.horaForm} hs</div>
                              </td>
                              <td className="p-3 font-semibold text-[#023047]">{inc.sucursal}</td>
                              <td className="p-3">
                                <span className="inline-block bg-[#8ECAE6]/30 text-[#023047] font-semibold px-2 py-0.5 rounded">
                                  {inc.evento}
                                </span>
                              </td>
                              <td className="p-3">
                                <div className="font-medium text-slate-800">{inc.reporto}</div>
                                <div className="text-[10px] text-slate-400">{inc.quienReportaText}</div>
                              </td>
                              <td className="p-3 font-bold text-slate-900">
                                ${parseFloat(inc.montoTotal || 0).toLocaleString('es-MX', { minimumFractionDigits: 2 })}
                              </td>
                              <td className="p-3">
                                {isAdminLoggedIn ? (
                                  <select
                                    value={inc.status || 'REGISTRADO'}
                                    onChange={(e) => handleUpdateStatus(inc.id, e.target.value)}
                                    className="text-[11px] border border-slate-200 rounded px-1.5 py-0.5 bg-slate-50"
                                  >
                                    <option value="REGISTRADO">REGISTRADO</option>
                                    <option value="EN REVISIÓN">EN REVISIÓN</option>
                                    <option value="RESUELTO">RESUELTO</option>
                                  </select>
                                ) : (
                                  <span className="px-2 py-0.5 rounded text-[10px] font-bold bg-slate-100 text-slate-700">
                                    {inc.status || 'REGISTRADO'}
                                  </span>
                                )}
                              </td>
                              <td className="p-3 text-right whitespace-nowrap">
                                <button
                                  onClick={() => setSelectedIncidentModal(inc)}
                                  className="p-1.5 text-slate-600 hover:text-[#209EBB] bg-slate-100 rounded-md mr-1"
                                  title="Ver Detalle"
                                >
                                  <IconEye className="w-4 h-4" />
                                </button>
                                <button
                                  onClick={() => setEditingIncident({ ...inc })}
                                  className="p-1.5 text-amber-700 bg-amber-100 rounded-md mr-1"
                                  title="Editar"
                                >
                                  <IconEdit className="w-4 h-4" />
                                </button>
                                {isAdminLoggedIn && (
                                  <button
                                    onClick={() => handleDeleteIncident(inc.id)}
                                    className="p-1.5 text-red-600 bg-red-50 rounded-md"
                                    title="Eliminar"
                                  >
                                    <IconTrash2 className="w-4 h-4" />
                                  </button>
                                )}
                              </td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </div>
                )}
              </div>
            )}

            {/* TAB 3: CONFIGURACIÓN CATÁLOGOS */}
            {activeTab === 'configuracion' && isAdminLoggedIn && (
              <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 sm:p-8 space-y-8 animate-fade-in">
                <div className="border-b border-slate-100 pb-4">
                  <h2 className="text-xl font-bold text-[#023047] flex items-center">
                    <IconSettings className="w-5 h-5 mr-2 text-[#FFB701]" /> Gestión de Listas y Catálogos
                  </h2>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                  {/* SUCURSALES */}
                  <div className="bg-slate-50 p-4 rounded-xl border border-slate-200 flex flex-col justify-between">
                    <div>
                      <h3 className="font-bold text-sm text-[#023047] flex items-center mb-3">
                        <IconMapPin className="w-4 h-4 mr-1.5 text-[#209EBB]" /> Sucursales ({catalogs.sucursales.length})
                      </h3>
                      <div className="space-y-1.5 max-h-60 overflow-y-auto pr-1 mb-4">
                        {catalogs.sucursales.map((suc, i) => (
                          <div key={i} className="flex items-center justify-between bg-white px-3 py-1.5 rounded-lg border border-slate-200 text-xs shadow-sm">
                            <span className="font-medium text-slate-700">{suc}</span>
                            <button onClick={() => handleDeleteCatalogItem('sucursales', suc)} className="text-slate-400 hover:text-red-500 p-1">
                              <IconX className="w-3.5 h-3.5" />
                            </button>
                          </div>
                        ))}
                      </div>
                    </div>
                    <form onSubmit={(e) => { e.preventDefault(); handleAddCatalogItem('sucursales', newSucursal, setNewSucursal); }} className="flex items-center space-x-1.5 pt-2 border-t border-slate-200">
                      <input type="text" placeholder="Nueva Sucursal..." value={newSucursal} onChange={(e) => setNewSucursal(e.target.value)} className="flex-1 px-2.5 py-1.5 text-xs bg-white border border-slate-300 rounded-lg" />
                      <button type="submit" className="p-1.5 bg-[#209EBB] text-white rounded-lg"><IconPlus className="w-4 h-4" /></button>
                    </form>
                  </div>

                  {/* REPORTÓ */}
                  <div className="bg-slate-50 p-4 rounded-xl border border-slate-200 flex flex-col justify-between">
                    <div>
                      <h3 className="font-bold text-sm text-[#023047] flex items-center mb-3">
                        <IconUser className="w-4 h-4 mr-1.5 text-[#209EBB]" /> Reportó ({catalogs.reportoList.length})
                      </h3>
                      <div className="space-y-1.5 max-h-60 overflow-y-auto pr-1 mb-4">
                        {catalogs.reportoList.map((rep, i) => (
                          <div key={i} className="flex items-center justify-between bg-white px-3 py-1.5 rounded-lg border border-slate-200 text-xs shadow-sm">
                            <span className="font-medium text-slate-700">{rep}</span>
                            <button onClick={() => handleDeleteCatalogItem('reportoList', rep)} className="text-slate-400 hover:text-red-500 p-1">
                              <IconX className="w-3.5 h-3.5" />
                            </button>
                          </div>
                        ))}
                      </div>
                    </div>
                    <form onSubmit={(e) => { e.preventDefault(); handleAddCatalogItem('reportoList', newReporto, setNewReporto); }} className="flex items-center space-x-1.5 pt-2 border-t border-slate-200">
                      <input type="text" placeholder="Nuevo Nombre..." value={newReporto} onChange={(e) => setNewReporto(e.target.value)} className="flex-1 px-2.5 py-1.5 text-xs bg-white border border-slate-300 rounded-lg" />
                      <button type="submit" className="p-1.5 bg-[#209EBB] text-white rounded-lg"><IconPlus className="w-4 h-4" /></button>
                    </form>
                  </div>

                  {/* EVENTOS */}
                  <div className="bg-slate-50 p-4 rounded-xl border border-slate-200 flex flex-col justify-between">
                    <div>
                      <h3 className="font-bold text-sm text-[#023047] flex items-center mb-3">
                        <IconAlertTriangle className="w-4 h-4 mr-1.5 text-[#FFB701]" /> Eventos ({catalogs.eventosList.length})
                      </h3>
                      <div className="space-y-1.5 max-h-60 overflow-y-auto pr-1 mb-4">
                        {catalogs.eventosList.map((ev, i) => (
                          <div key={i} className="flex items-center justify-between bg-white px-3 py-1.5 rounded-lg border border-slate-200 text-xs shadow-sm">
                            <span className="font-medium text-slate-700">{ev}</span>
                            <button onClick={() => handleDeleteCatalogItem('eventosList', ev)} className="text-slate-400 hover:text-red-500 p-1">
                              <IconX className="w-3.5 h-3.5" />
                            </button>
                          </div>
                        ))}
                      </div>
                    </div>
                    <form onSubmit={(e) => { e.preventDefault(); handleAddCatalogItem('eventosList', newEvent, setNewEvent); }} className="flex items-center space-x-1.5 pt-2 border-t border-slate-200">
                      <input type="text" placeholder="Nuevo Evento..." value={newEvent} onChange={(e) => setNewEvent(e.target.value)} className="flex-1 px-2.5 py-1.5 text-xs bg-white border border-slate-300 rounded-lg" />
                      <button type="submit" className="p-1.5 bg-[#209EBB] text-white rounded-lg"><IconPlus className="w-4 h-4" /></button>
                    </form>
                  </div>
                </div>
              </div>
            )}

            {/* LOGIN DE ADMIN */}
            {activeTab === 'login' && !isAdminLoggedIn && (
              <div className="max-w-md mx-auto bg-white rounded-2xl shadow-md border border-slate-200 p-8 my-8 animate-fade-in">
                <div className="text-center mb-6">
                  <div className="w-12 h-12 bg-[#023047] text-[#FFB701] rounded-2xl flex items-center justify-center mx-auto mb-3 shadow">
                    <IconLock className="w-6 h-6" />
                  </div>
                  <h2 className="text-xl font-bold text-[#023047]">Iniciar Sesión Administrador</h2>
                </div>

                {loginError && (
                  <div className="mb-4 p-3 bg-red-50 border border-red-200 text-red-700 text-xs rounded-lg font-medium">
                    {loginError}
                  </div>
                )}

                <form onSubmit={handleAdminLogin} className="space-y-4">
                  <div>
                    <label className="block text-xs font-semibold text-slate-700 mb-1">Usuario</label>
                    <input
                      type="text"
                      required
                      placeholder="admin"
                      value={adminUsername}
                      onChange={(e) => setAdminUsername(e.target.value)}
                      className="w-full px-3.5 py-2 text-sm border border-slate-300 rounded-lg"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-700 mb-1">Contraseña</label>
                    <input
                      type="password"
                      required
                      placeholder="••••••••"
                      value={adminPassword}
                      onChange={(e) => setAdminPassword(e.target.value)}
                      className="w-full px-3.5 py-2 text-sm border border-slate-300 rounded-lg"
                    />
                  </div>

                  <button type="submit" className="w-full py-2.5 bg-[#023047] text-white text-sm font-semibold rounded-lg shadow">
                    Entrar como Administrador
                  </button>
                  <p className="text-center text-[11px] text-slate-400 pt-2">Credenciales Demo: <b>admin</b> / <b>admin123</b></p>
                </form>
              </div>
            )}

            {/* MODAL DETALLE DE INCIDENCIA */}
            {selectedIncidentModal && (
              <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
                <div className="bg-white rounded-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto shadow-2xl border border-slate-200">
                  <div className="p-5 border-b border-slate-100 flex items-center justify-between sticky top-0 bg-white z-10">
                    <div>
                      <h3 className="font-bold text-lg text-[#023047]">Detalle de la Incidencia</h3>
                      <p className="text-xs text-slate-400">ID: {selectedIncidentModal.id}</p>
                    </div>
                    <button onClick={() => setSelectedIncidentModal(null)} className="p-1.5 text-slate-400 hover:text-slate-600 rounded-full hover:bg-slate-100">
                      <IconX className="w-5 h-5" />
                    </button>
                  </div>

                  <div className="p-6 space-y-6">
                    <div className="grid grid-cols-2 sm:grid-cols-3 gap-4 text-xs bg-slate-50 p-4 rounded-xl border border-slate-100">
                      <div>
                        <span className="text-slate-400 block font-medium">Sucursal:</span>
                        <span className="font-bold text-slate-800 text-sm">{selectedIncidentModal.sucursal}</span>
                      </div>
                      <div>
                        <span className="text-slate-400 block font-medium">Evento:</span>
                        <span className="font-bold text-[#209EBB] text-sm">{selectedIncidentModal.evento}</span>
                      </div>
                      <div>
                        <span className="text-slate-400 block font-medium">Monto Total:</span>
                        <span className="font-black text-slate-900 text-sm">
                          ${parseFloat(selectedIncidentModal.montoTotal || 0).toLocaleString('es-MX', { minimumFractionDigits: 2 })}
                        </span>
                      </div>
                    </div>

                    <div className="space-y-4">
                      <h4 className="font-bold text-xs text-slate-500 uppercase tracking-wider">Archivos de Evidencia</h4>
                      <MediaPreviewCard title="Foto del inventario (sustracción)" media={selectedIncidentModal.fotoInventario} />
                      <MediaPreviewCard title="Foto del sospechoso" media={selectedIncidentModal.fotoSospechoso} />
                      <MediaPreviewCard title="Evidencia de los hechos" media={selectedIncidentModal.evidenciaHechos} />
                      <MediaPreviewCard title="Fotos del vehículo (tránsito terrestre)" media={selectedIncidentModal.fotosVehiculo} />
                    </div>
                  </div>

                  <div className="p-4 border-t border-slate-100 bg-slate-50 flex items-center justify-between">
                    <button
                      onClick={() => {
                        setEditingIncident({ ...selectedIncidentModal });
                        setSelectedIncidentModal(null);
                      }}
                      className="inline-flex items-center px-4 py-2 bg-amber-500 hover:bg-amber-600 text-white font-medium text-xs rounded-lg shadow transition"
                    >
                      <IconEdit className="w-3.5 h-3.5 mr-1.5" /> Editar o Añadir Fotos
                    </button>
                    <button onClick={() => setSelectedIncidentModal(null)} className="px-5 py-2 bg-slate-800 text-white font-medium text-xs rounded-lg">
                      Cerrar
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* MODAL EDITAR INCIDENCIA */}
            {editingIncident && (
              <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
                <div className="bg-white rounded-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto shadow-2xl border border-slate-200">
                  <div className="p-5 border-b border-slate-100 flex items-center justify-between sticky top-0 bg-white z-10">
                    <div>
                      <h3 className="font-bold text-lg text-[#023047] flex items-center">
                        <IconEdit className="w-5 h-5 mr-2 text-amber-500" /> Editar Incidencia
                      </h3>
                    </div>
                    <button onClick={() => setEditingIncident(null)} className="p-1.5 text-slate-400 hover:text-slate-600 rounded-full hover:bg-slate-100">
                      <IconX className="w-5 h-5" />
                    </button>
                  </div>

                  <form onSubmit={handleSaveEdit} className="p-6 space-y-5">
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                      <div>
                        <label className="block text-xs font-semibold text-slate-700 mb-1">Monto Total ($)</label>
                        <input
                          type="number"
                          step="0.01"
                          required
                          value={editingIncident.montoTotal || ''}
                          onChange={(e) => setEditingIncident({ ...editingIncident, montoTotal: e.target.value })}
                          className="w-full px-3 py-2 text-xs border rounded-lg bg-slate-50 font-bold"
                        />
                      </div>
                    </div>

                    <div className="space-y-4">
                      <h4 className="font-bold text-xs text-[#023047] uppercase tracking-wider">Adjuntar / Modificar Fotografías</h4>
                      
                      <div>
                        <label className="block text-xs font-semibold text-slate-700 mb-1">Foto del inventario (sustracción):</label>
                        <UploadBox
                          id="edit_fotoInventario"
                          fileData={editingIncident.fotoInventario}
                          onChange={(e) => handleFileUpload(e, 'fotoInventario', true)}
                          onRemove={() => setEditingIncident({ ...editingIncident, fotoInventario: null })}
                        />
                      </div>

                      <div>
                        <label className="block text-xs font-semibold text-slate-700 mb-1">Foto del sospechoso:</label>
                        <UploadBox
                          id="edit_fotoSospechoso"
                          fileData={editingIncident.fotoSospechoso}
                          onChange={(e) => handleFileUpload(e, 'fotoSospechoso', true)}
                          onRemove={() => setEditingIncident({ ...editingIncident, fotoSospechoso: null })}
                        />
                      </div>

                      <div>
                        <label className="block text-xs font-semibold text-slate-700 mb-1">Evidencia de los hechos:</label>
                        <UploadBox
                          id="edit_evidenciaHechos"
                          fileData={editingIncident.evidenciaHechos}
                          onChange={(e) => handleFileUpload(e, 'evidenciaHechos', true)}
                          onRemove={() => setEditingIncident({ ...editingIncident, evidenciaHechos: null })}
                        />
                      </div>

                      <div>
                        <label className="block text-xs font-semibold text-slate-700 mb-1">Fotos del vehículo (tránsito terrestre):</label>
                        <UploadBox
                          id="edit_fotosVehiculo"
                          fileData={editingIncident.fotosVehiculo}
                          onChange={(e) => handleFileUpload(e, 'fotosVehiculo', true)}
                          onRemove={() => setEditingIncident({ ...editingIncident, fotosVehiculo: null })}
                        />
                      </div>
                    </div>

                    <div className="pt-4 border-t border-slate-100 flex items-center justify-end space-x-3">
                      <button
                        type="button"
                        onClick={() => setEditingIncident(null)}
                        className="px-4 py-2 border border-slate-300 text-slate-600 rounded-lg text-xs"
                      >
                        Cancelar
                      </button>
                      <button
                        type="submit"
                        disabled={savingEdit}
                        className="px-6 py-2 bg-black hover:bg-slate-800 text-white text-xs font-semibold rounded-lg shadow"
                      >
                        {savingEdit ? 'Guardando...' : 'Guardar Cambios'}
                      </button>
                    </div>
                  </form>
                </div>
              </div>
            )}

            {/* NOTIFICACIONES Y CONFIRMACIONES */}
            {toast && (
              <div className={`fixed bottom-5 right-5 z-50 px-4 py-3 rounded-xl shadow-xl text-xs font-semibold flex items-center space-x-2 ${
                toast.type === 'error' ? 'bg-red-900 text-white' :
                toast.type === 'warning' ? 'bg-amber-500 text-white' :
                toast.type === 'success' ? 'bg-emerald-600 text-white' :
                'bg-slate-800 text-white'
              }`}>
                <span>{toast.message}</span>
                <button onClick={() => setToast(null)} className="ml-2"><IconX className="w-3.5 h-3.5" /></button>
              </div>
            )}

            {confirmModal && (
              <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
                <div className="bg-white rounded-2xl max-w-sm w-full p-6 shadow-2xl border border-slate-100 text-center space-y-4">
                  <div className="w-12 h-12 bg-amber-100 text-amber-600 rounded-full flex items-center justify-center mx-auto">
                    <IconAlertTriangle className="w-6 h-6" />
                  </div>
                  <div>
                    <h3 className="font-bold text-base text-slate-800">{confirmModal.title}</h3>
                    <p className="text-xs text-slate-500 mt-1">{confirmModal.message}</p>
                  </div>
                  <div className="flex items-center justify-center space-x-3 pt-2">
                    <button onClick={() => setConfirmModal(null)} className="px-4 py-2 border border-slate-300 text-slate-600 rounded-lg text-xs">Cancelar</button>
                    <button onClick={confirmModal.onConfirm} className="px-4 py-2 bg-red-600 text-white rounded-lg text-xs font-semibold shadow">Confirmar</button>
                  </div>
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    function UploadBox({ id, fileData, onChange, onRemove }) {
      return (
        <div className="mt-1">
          {fileData ? (
            <div className="relative border border-slate-200 rounded-xl p-3 bg-slate-50 flex items-center justify-between">
              <div className="flex items-center space-x-3 overflow-hidden">
                {fileData.type?.startsWith('image/') ? (
                  <img src={fileData.data} alt="preview" className="w-12 h-12 object-cover rounded-lg border" />
                ) : (
                  <div className="w-12 h-12 bg-slate-200 rounded-lg flex items-center justify-center"><IconUploadCloud className="w-6 h-6 text-slate-500" /></div>
                )}
                <div className="truncate">
                  <p className="text-xs font-semibold text-slate-700 truncate">{fileData.name}</p>
                  <p className="text-[10px] text-emerald-600 font-medium">Cargado correctamente</p>
                </div>
              </div>
              <button type="button" onClick={onRemove} className="p-1.5 text-slate-400 hover:text-red-500"><IconX className="w-4 h-4" /></button>
            </div>
          ) : (
            <label htmlFor={id} className="border-2 border-dashed border-slate-300 rounded-xl p-4 flex flex-col items-center justify-center cursor-pointer hover:border-[#209EBB] hover:bg-slate-50 transition">
              <IconUploadCloud className="w-5 h-5 text-slate-400 mb-1" />
              <p className="text-xs text-slate-600 font-medium text-center">
                <span className="underline text-slate-700">Selecciona un archivo</span>
              </p>
              <input id={id} type="file" accept="image/*,video/*" onChange={onChange} className="hidden" />
            </label>
          )}
        </div>
      );
    }

    function MediaPreviewCard({ title, media }) {
      if (!media) {
        return (
          <div className="p-3 bg-slate-50 border border-slate-100 rounded-lg text-xs text-slate-400 flex items-center justify-between">
            <span>{title}</span>
            <span className="italic">No adjuntado</span>
          </div>
        );
      }

      return (
        <div className="p-3 bg-white border border-slate-200 rounded-xl space-y-2">
          <div className="flex items-center justify-between text-xs">
            <span className="font-semibold text-slate-700">{title}</span>
            <a href={media.data} download={media.name || 'evidencia'} className="text-[#209EBB] hover:underline text-[11px] font-medium">Descargar</a>
          </div>
          <div className="rounded-lg overflow-hidden border border-slate-100 bg-slate-900 max-h-64 flex items-center justify-center">
            {media.type?.startsWith('image/') ? (
              <img src={media.data} alt={title} className="max-h-64 object-contain" />
            ) : media.type?.startsWith('video/') ? (
              <video src={media.data} controls className="max-h-64 w-full" />
            ) : (
              <div className="p-4 text-white text-xs">Vista previa no disponible</div>
            )}
          </div>
        </div>
      );
    }

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
